<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeFlow — Colony Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0D0F0E; color: rgba(255,255,255,0.87);
    }
    :root {
      --bg-app: #0D0F0E;
      --surface-1: #141614;
      --surface-2: #1C1F1C;
      --surface-3: #242824;
      --border-subtle: rgba(255,255,255,0.06);
      --border-active: rgba(255,255,255,0.15);
      --amber: #E8A020;
      --amber-soft: rgba(232,160,32,0.15);
      --amber-hover: #F0B840;
      --green: #4CAF72;
      --green-soft: rgba(76,175,114,0.12);
      --danger: #E05252;
      --danger-soft: rgba(224,82,82,0.12);
      --info: #4A90D9;
      --info-soft: rgba(74,144,217,0.12);
      --text-primary: rgba(255,255,255,0.87);
      --text-secondary: rgba(255,255,255,0.55);
      --text-tertiary: rgba(255,255,255,0.35);
      --font-mono: 'JetBrains Mono', monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }
    #root { height: 100%; }

    /* ── Layout ── */
    .app-layout { display: flex; flex-direction: column; height: 100vh; }
    .main-area { display: flex; flex: 1; overflow: hidden; }
    .side-panel { background: var(--surface-2); overflow: hidden; transition: width 0.25s ease; flex-shrink: 0; display: flex; flex-direction: column; }
    .left-panel { width: 240px; border-right: 1px solid var(--border-subtle); }
    .right-panel { width: 280px; border-left: 1px solid var(--border-subtle); }
    .collapsed-panel { width: 36px; align-items: center; justify-content: flex-start; padding-top: 10px; }
    .grid-area { flex: 1; overflow: hidden; min-width: 0; }

    /* ── Topbar ── */
    .topbar {
      height: 44px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--surface-1); border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0; gap: 12px; user-select: none;
    }
    .topbar-section { display: flex; align-items: center; gap: 8px; }
    .topbar-left { gap: 8px; flex-shrink: 0; }
    .topbar-center { flex: 1; justify-content: center; gap: 12px; }
    .topbar-right { gap: 4px; flex-shrink: 0; }
    .app-title { font-size: 15px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.01em; }
    .app-ver { font-size: 10px; color: var(--text-tertiary); font-family: var(--font-mono); }
    .sim-controls { display: flex; gap: 4px; }
    .ctrl-btn {
      width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
      background: var(--surface-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--amber-soft); color: var(--amber); border-color: rgba(232,160,32,0.3); }
    .speed-group { display: flex; gap: 2px; background: var(--surface-3); border-radius: var(--radius-sm); padding: 2px; }
    .speed-btn {
      padding: 3px 8px; border: none; border-radius: 3px; background: transparent;
      color: var(--text-tertiary); font-size: 11px; font-family: var(--font-mono);
      cursor: pointer; transition: all 0.15s;
    }
    .speed-btn:hover { color: var(--text-secondary); }
    .speed-btn.active { background: var(--amber); color: var(--bg-app); font-weight: 500; }
    .topbar-divider { width: 1px; height: 20px; background: var(--border-subtle); flex-shrink: 0; }
    .tick-info { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .tick-lbl { font-size: 9px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
    .tick-val { font-size: 12px; color: var(--text-primary); font-family: var(--font-mono); font-weight: 400; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: var(--radius-sm); font-size: 10px; font-weight: 500;
      letter-spacing: 0.06em; font-family: var(--font-mono);
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .icon-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
      color: var(--text-tertiary); cursor: pointer; transition: all 0.15s;
    }
    .icon-btn:hover { color: var(--text-secondary); background: var(--surface-3); border-color: var(--border-subtle); }

    /* ── Panels ── */
    .panel-header {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .panel-title { font-size: 11px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; flex: 1; }
    .panel-collapse-btn, .panel-expand-btn {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border: none; background: none;
      color: var(--text-tertiary); cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s;
    }
    .panel-collapse-btn:hover, .panel-expand-btn:hover { color: var(--text-secondary); background: var(--surface-3); }
    .panel-scroll { overflow-y: auto; flex: 1; }
    .panel-scroll::-webkit-scrollbar { width: 3px; }
    .panel-scroll::-webkit-scrollbar-track { background: transparent; }
    .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

    /* ── Collapsible sections ── */
    .panel-section { border-bottom: 1px solid var(--border-subtle); }
    .section-hd {
      display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 12px;
      border: none; background: none; color: var(--text-secondary); cursor: pointer;
      font-size: 12px; font-weight: 500; text-align: left; font-family: inherit; transition: background 0.12s;
    }
    .section-hd:hover { background: rgba(255,255,255,0.02); }
    .section-ico { display: flex; color: var(--text-tertiary); flex-shrink: 0; }
    .section-tl { flex: 1; }
    .chevron { transition: transform 0.2s ease; color: var(--text-tertiary); flex-shrink: 0; }
    .chevron.open { transform: rotate(180deg); }
    .section-body { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.3s ease, opacity 0.2s ease; }
    .section-body.open { max-height: 600px; opacity: 1; }
    .section-inner { padding: 6px 12px 12px; }

    /* ── Role bars / Population ── */
    .pop-total {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding: 6px 8px; background: var(--surface-3); border-radius: var(--radius-sm);
    }
    .pop-total-label { font-size: 11px; color: var(--text-secondary); }
    .pop-total-value { font-size: 13px; color: var(--amber); font-family: var(--font-mono); font-weight: 500; }
    .role-bar { margin-bottom: 8px; }
    .role-bar:last-child { margin-bottom: 0; }
    .role-bar-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .role-label { font-size: 11px; color: var(--text-secondary); }
    .role-value { font-size: 11px; color: var(--text-primary); font-family: var(--font-mono); }
    .role-track { height: 3px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
    .role-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

    /* ── Health ── */
    .health-row { display: flex; gap: 12px; align-items: center; }
    .health-legend { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
    .legend-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .legend-val { color: var(--text-primary); font-family: var(--font-mono); margin-left: auto; font-size: 11px; }

    /* ── Energy ── */
    .energy-bars { display: flex; flex-direction: column; gap: 10px; }
    .energy-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .energy-label { font-size: 11px; color: var(--text-secondary); }
    .energy-val { font-size: 11px; color: var(--text-primary); font-family: var(--font-mono); }
    .energy-track { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
    .energy-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    /* ── Right panel controls ── */
    .slider-row { margin-bottom: 12px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .slider-label { font-size: 11px; color: var(--text-secondary); }
    .slider-val { font-size: 11px; color: var(--text-primary); font-family: var(--font-mono); min-width: 36px; text-align: right; }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 3px; border-radius: 2px;
      background: var(--surface-3); outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--amber); border: 2px solid var(--surface-1); cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb:hover { background: var(--amber-hover); }
    .season-selector { display: flex; gap: 2px; background: var(--surface-3); border-radius: var(--radius-sm); padding: 2px; }
    .season-btn {
      flex: 1; padding: 5px 2px; border: none; border-radius: 3px; background: transparent;
      color: var(--text-tertiary); font-size: 10px; cursor: pointer; transition: all 0.15s;
      text-align: center; font-family: inherit; border-bottom: 2px solid transparent;
    }
    .season-btn:hover { color: var(--text-secondary); }
    .season-btn.active { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; margin-bottom: 8px; }
    .toggle-label { font-size: 11px; color: var(--text-secondary); }
    .toggle-switch { position: relative; width: 32px; height: 18px; cursor: pointer; flex-shrink: 0; }
    .toggle-track {
      position: absolute; inset: 0; background: var(--surface-3); border-radius: 9px;
      transition: all 0.2s; border: 1px solid var(--border-subtle);
    }
    .toggle-switch.on .toggle-track { background: var(--amber-soft); border-color: var(--amber); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--text-tertiary); transition: all 0.2s;
    }
    .toggle-switch.on .toggle-thumb { left: 17px; background: var(--amber); }
    .apply-btn {
      width: 100%; padding: 8px; border: none; border-radius: var(--radius-sm);
      background: var(--amber); color: var(--bg-app); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s; font-family: inherit; letter-spacing: 0.01em;
    }
    .apply-btn:hover { background: var(--amber-hover); }

    /* ── Grid ── */
    .grid-container {
      position: relative; width: 100%; height: 100%; background: var(--bg-app);
      display: flex; align-items: center; justify-content: center;
    }
    .grid-canvas { cursor: crosshair; display: block; }
    .grid-legend {
      position: absolute; bottom: 12px; left: 12px; background: rgba(13,15,14,0.88);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      padding: 8px 10px; display: flex; flex-direction: column; gap: 5px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .legend-row { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-secondary); }
    .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .zoom-controls { position: absolute; bottom: 12px; right: 12px; display: flex; flex-direction: column; gap: 3px; }
    .zoom-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      background: rgba(13,15,14,0.88); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer;
      font-size: 15px; font-family: var(--font-mono); backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px); transition: all 0.15s;
    }
    .zoom-btn:hover { color: var(--text-primary); border-color: var(--border-active); }
    .cell-tooltip {
      position: fixed; padding: 8px 10px; background: rgba(20,22,20,0.96);
      border: 1px solid var(--border-active); border-radius: var(--radius-sm);
      pointer-events: none; z-index: 100; backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .tooltip-title { font-size: 11px; font-family: var(--font-mono); color: var(--amber); margin-bottom: 4px; font-weight: 500; }
    .tooltip-row { font-size: 10px; color: var(--text-secondary); display: flex; justify-content: space-between; gap: 16px; line-height: 1.6; }
    .tooltip-val { color: var(--text-primary); font-family: var(--font-mono); }

    /* ── Bottom bar ── */
    .bottom-bar {
      height: 80px; background: var(--surface-1); border-top: 1px solid var(--border-subtle);
      display: flex; align-items: stretch; padding: 8px 12px; gap: 8px; flex-shrink: 0;
    }
    .metric-card {
      flex: 1; background: var(--surface-2); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 8px 10px; display: flex; flex-direction: column;
      justify-content: center; gap: 2px; min-width: 0;
    }
    .metric-top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
    .metric-value { font-size: 17px; font-family: var(--font-mono); color: var(--text-primary); font-weight: 400; white-space: nowrap; }
    .metric-trend { font-size: 10px; font-family: var(--font-mono); white-space: nowrap; }
    .metric-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .metric-label { font-size: 9px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }

    /* ── Animations ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ── Responsive tweak ── */
    @media (max-width: 1100px) {
      .left-panel { width: 200px; }
      .right-panel { width: 240px; }
    }
    @media (max-width: 900px) {
      .left-panel:not(.collapsed-panel) { width: 180px; }
      .right-panel:not(.collapsed-panel) { width: 200px; }
      .topbar-center .tick-info { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="topbar.jsx"></script>
  <script type="text/babel" src="left-panel.jsx"></script>
  <script type="text/babel" src="right-panel.jsx"></script>
  <script type="text/babel" src="grid.jsx"></script>
  <script type="text/babel" src="bottom-bar.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>

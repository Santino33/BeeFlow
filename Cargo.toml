[package]
name = "beeflow"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[dependencies]
arrayvec         = "0.7"
hecs             = "0.10"
rayon            = "1.10"
ndarray          = "0.16"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-flame    = "0.2"
rand             = "0.8"
rand_xoshiro     = "0.6"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile  = "3"

[[bench]]
name    = "tick_loop"
harness = false

[[bench]]
name    = "grid_access"
harness = false
